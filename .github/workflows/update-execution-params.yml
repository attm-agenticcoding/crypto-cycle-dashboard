name: Update execution parameters

on:
  workflow_dispatch:
  schedule:
    # GitHub may delay or drop an individual scheduled event. Retry through the
    # morning; the script exits before downloading when data_as_of is current.
    - cron: "7 0 * * 1-5"
      timezone: "America/New_York"
    - cron: "37 0 * * 1-5"
      timezone: "America/New_York"
    - cron: "17 2,6,10 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: execution-parameter-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refit rolling execution parameters
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python scripts/update_execution_params.py --force
          else
            python scripts/update_execution_params.py
          fi
      - name: Publish changed parameters
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/execution_params.json
          if git diff --cached --quiet; then
            echo "No parameter change to publish."
          else
            git commit -m "Update rolling execution parameters"
            git push
          fi
