name: Dashboard publication clock
run-name: Dashboard publication clock (${{ (github.event_name == 'schedule' || inputs.verify_only == false) && 'production' || 'verify' }})

on:
  workflow_dispatch:
    inputs:
      verify_only:
        type: boolean
        default: true
        description: Check the timer without private credentials or publication
      remaining:
        type: choice
        options: ['0', '1']
        default: '0'
        description: Additional verification ticks (production always continues)

# Scheduled restart checks are owned by dashboard-watchdog.yml. Production
# ticks continue to enqueue their existing five-minute successor.

permissions: {}

concurrency:
  group: dashboard-clock-${{ inputs.verify_only && 'verify' || 'production' }}
  cancel-in-progress: false

jobs:
  tick:
    if: github.repository == 'attm-agenticcoding/crypto-cycle-dashboard' && github.ref == 'refs/heads/main' && (inputs.verify_only || vars.DASHBOARD_CLOCK_ENABLED == 'true')
    environment:
      name: ${{ inputs.verify_only && 'dashboard-clock-verify' || 'dashboard-clock' }}
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      # Keep this inline and first: neither a failed checkout nor a missing
      # promisor blob may prevent the next protected five-minute wait.
      - name: Ensure one successor before checkout
        id: successor
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          CLOCK_ENABLED: ${{ vars.DASHBOARD_CLOCK_ENABLED }}
          VERIFY_ONLY: ${{ inputs.verify_only && 'true' || 'false' }}
          REMAINING: ${{ inputs.remaining || '0' }}
        shell: python
        run: |
          # BEGIN CHECKOUT-INDEPENDENT SUCCESSOR
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          REPOSITORY = 'attm-agenticcoding/crypto-cycle-dashboard'
          WORKFLOW = 'dashboard-clock.yml'
          PREFIX = f'/repos/{REPOSITORY}/actions/workflows/{WORKFLOW}'
          ACTIVE = ('requested', 'pending', 'waiting', 'queued', 'in_progress')
          VERIFY_NAME = 'Dashboard publication clock (verify)'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def github_api(path, token, method='GET', body=None, deadline=None):
              payload = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request('https://api.github.com' + path, data=payload, method=method,
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28',
                           'User-Agent': 'dashboard-clock-successor'})
              # Read retries are bounded. Never retry an uncertain dispatch:
              # GitHub may have accepted it before the response was lost.
              attempts = 2 if method == 'GET' else 1
              for attempt in range(attempts):
                  if deadline is not None:
                      check_budget(deadline)
                  timeout = 5 if deadline is None else min(5, deadline - time.monotonic())
                  try:
                      with urllib.request.build_opener(NoRedirect).open(req, timeout=max(0.001, timeout)) as response:
                          data = response.read()
                          return json.loads(data) if data else {}
                  except urllib.error.HTTPError as exc:
                      retry = exc.code == 429 or exc.code >= 500
                      exc.close()
                  except (urllib.error.URLError, TimeoutError):
                      retry = True
                  if not retry or attempt == attempts - 1:
                      raise RuntimeError(f'GitHub {method} failed; reconcile before another dispatch') from None
                  if deadline is not None and time.monotonic() + 1 >= deadline:
                      raise ValueError('Run inventory deadline exceeded; refusing dispatch')
                  time.sleep(1)

          class InventoryChanged(ValueError):
              """A read was valid JSON but not a complete, consistent inventory."""

          def check_budget(deadline):
              if time.monotonic() >= deadline:
                  raise ValueError('Run inventory deadline exceeded; refusing dispatch')

          def inventory(env, request, deadline):
              found = []
              for status in ACTIVE:
                  expected_total, seen = None, set()
                  for page in range(1, 11):
                      check_budget(deadline)
                      payload = request(PREFIX + f'/runs?status={status}&per_page=100&page={page}', env['GH_TOKEN'])
                      rows = payload.get('workflow_runs') if isinstance(payload, dict) else None
                      total = payload.get('total_count') if isinstance(payload, dict) else None
                      if not isinstance(rows, list) or type(total) is not int or total < 0:
                          raise ValueError(f'Malformed run inventory: status={status} page={page}; refusing dispatch')
                      detail = f'status={status} page={page} total={total} rows={len(rows)} expected_total={expected_total}'
                      if total > 1000:
                          raise ValueError(f'Run inventory exceeds 1000-row safety bound: {detail}; refusing dispatch')
                      if (expected_total is not None and total != expected_total
                              or len(rows) != min(100, max(0, total - (page - 1) * 100))):
                          raise InventoryChanged(f'Incomplete or changing run inventory: {detail}')
                      expected_total = total
                      for run in rows:
                          if (not isinstance(run, dict) or type(run.get('id')) is not int or run['id'] <= 0
                                  or run.get('path') != '.github/workflows/' + WORKFLOW
                                  or not isinstance(run.get('repository'), dict)
                                  or run['repository'].get('full_name') != REPOSITORY
                                  or any(not isinstance(run.get(key), str) or not run[key]
                                         for key in ('head_branch', 'event', 'display_title', 'status'))
                                  or run['status'] not in (*ACTIVE, 'completed')):
                              raise ValueError(f'Malformed run identity: {detail}; refusing dispatch')
                          if run['id'] in seen:
                              raise InventoryChanged(f'Duplicate run across inventory pages: {detail}')
                          seen.add(run['id'])
                          # Preserve every validated sighting: later status or
                          # identity metadata must not erase an earlier blocker.
                          found.append(run)
                      if len(seen) == total:
                          break
                  else:
                      raise ValueError('Run inventory exceeds page bound; refusing dispatch')
              return found

          def reconcile(env, request, current, verify, deadline):
              # Retry the entire read-only scan, never the dispatch. Counts and
              # rows can disagree while GitHub updates its run-state indexes.
              for attempt in range(1, 4):
                  try:
                      blockers = set()
                      # Two complete scans reduce the window for state transitions
                      # between filters. They are not an atomic GitHub snapshot.
                      for _ in range(2):
                          for run in inventory(env, request, deadline):
                              if (run['id'] != current and run['head_branch'] == 'main'
                                      and run['status'] in ACTIVE
                                      and (run['display_title'] == VERIFY_NAME) == verify):
                                  blockers.add(run['id'])
                          if blockers:
                              return blockers
                      check_budget(deadline)
                      return blockers
                  except InventoryChanged as exc:
                      print(json.dumps({'event': 'successor-inventory-retry', 'attempt': attempt,
                                        'reason': str(exc)}, sort_keys=True))
                      if attempt == 3:
                          raise ValueError(f'Run inventory inconsistent after {attempt} scans; refusing dispatch: {exc}') from None
                      check_budget(deadline)
                      time.sleep(attempt)
              raise AssertionError('Unreachable inventory retry state')

          def enqueue(env, request=github_api):
              if (env.get('GITHUB_REPOSITORY') != REPOSITORY or env.get('GITHUB_REF') != 'refs/heads/main'
                      or env.get('GITHUB_EVENT_NAME') not in ('workflow_dispatch', 'schedule')):
                  raise ValueError('Successor is restricted to trusted public main clock events')
              if env.get('VERIFY_ONLY') not in ('true', 'false') or env.get('REMAINING') not in ('0', '1'):
                  raise ValueError('Verification is bounded to at most two ticks')
              verify = env['VERIFY_ONLY'] == 'true'
              if not verify and env.get('CLOCK_ENABLED') != 'true':
                  return {'status': 'disabled'}
              if verify and env['REMAINING'] == '0':
                  return {'status': 'verification-complete'}
              current = int(env['GITHUB_RUN_ID'])
              if current <= 0:
                  raise ValueError('Missing current run identity')
              deadline = time.monotonic() + 90
              read = (lambda path, token: github_api(path, token, deadline=deadline)) if request is github_api else request
              blockers = reconcile(env, read, current, verify, deadline)
              if blockers:
                  return {'status': 'successor-already-active', 'run_ids': sorted(blockers)}
              check_budget(deadline)
              request(PREFIX + '/dispatches', env['GH_TOKEN'], 'POST',
                      {'ref': 'main', 'inputs': {'verify_only': str(verify).lower(), 'remaining': '0'}})
              return {'status': 'successor-enqueued'}

          def main():
              result = enqueue(os.environ)
              print(json.dumps(result, sort_keys=True))
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write('status=' + result['status'] + '\n')

          if __name__ == '__main__':
              main()
          # END CHECKOUT-INDEPENDENT SUCCESSOR
      - name: Check out only the public clock
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: scripts/dashboard_clock.py
          sparse-checkout-cone-mode: false
      - name: Check publication after securing the successor
        env:
          GH_TOKEN: ${{ github.token }}
          CLOCK_ENABLED: ${{ vars.DASHBOARD_CLOCK_ENABLED }}
          VERIFY_ONLY: ${{ inputs.verify_only && 'true' || 'false' }}
          REMAINING: ${{ inputs.remaining || '0' }}
          CLOCK_SUCCESSOR_STATUS: ${{ steps.successor.outputs.status }}
          CYCLE_CLOCK_APP_ID: ${{ secrets.CYCLE_CLOCK_APP_ID }}
          CYCLE_CLOCK_INSTALLATION_ID: ${{ secrets.CYCLE_CLOCK_INSTALLATION_ID }}
          CYCLE_CLOCK_PRIVATE_KEY: ${{ secrets.CYCLE_CLOCK_PRIVATE_KEY }}
          CYCLE_SOURCE_REPOSITORY: ${{ secrets.CYCLE_SOURCE_REPOSITORY }}
        run: python3 scripts/dashboard_clock.py --verify-only "$VERIFY_ONLY" --remaining "$REMAINING"
