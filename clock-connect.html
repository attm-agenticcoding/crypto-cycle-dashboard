<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action https://github.com; base-uri 'none'"><title>连接看板自动更新</title>
<style>body{font:17px/1.65 system-ui;max-width:660px;margin:40px auto;padding:0 22px;color:#18242c}h1{font-size:26px}button{font:inherit;padding:12px 18px;border:0;border-radius:8px;background:#17643a;color:white;margin:8px 0}textarea{width:100%;box-sizing:border-box;height:170px;font:13px/1.4 monospace;padding:12px;overflow-wrap:anywhere}small{color:#53616b}.error{color:#a22323}</style></head>
<body><h1>连接看板自动更新</h1><main id="content"><p>正在准备安全授权…</p></main>
<script>
'use strict';
const publicKeyPEM = "-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEArGBsvKuZMfqmBQjeczLG\nJy9LujwHG1e5AmfGL8zko9EigKKzAUf3ujFhD24ywUdLGEmRyQncMYdF1Q9xrOjs\nmmO6zetAXBWsfbe2bA8nIy3ZUpbphQhkYJyZu9S4rpJWEujClNbXFmyCzL0fiGHZ\npKN1/pLLryP4EidUKRpfGu3cQzGduFpS7ZcPuecf/69lTZ30fFKai5ettXJQuefH\npbqqMv//F+YDcKMEhozh6PSACXncCXbORjk1edHySFKoJtsMD02g1zbCFYyHAruc\naDY8x6l/y3iH08MtomyDrcazhf/x3cnnWpbdZEXwNCSQJF/TR6I9S4AywO+Aq2oN\nazZ657U+QsK0W97LRou/GYntzB8BYqC/bcwr2uOmwoPUkrfyCGnubLbR54u9XkOe\nt9pVIN0mqoG1KnqOSh5esU8LUln7jJTsQxiKw1rklaMvjpZqYwAWjbOt/S5jwmtj\nf7+2NrZ3MtRPOmOlJnOJ/SEAT6QsxF4cYNZVPk2Hg5OFAgMBAAE=\n-----END PUBLIC KEY-----\n";
const pageURL = 'https://attm-agenticcoding.github.io/crypto-cycle-dashboard/clock-connect.html';
const content = document.getElementById('content');
const parameters = new URLSearchParams(location.search);
const fragment = new URLSearchParams(location.hash.slice(1));
const element = (tag, text, parent=content) => {const el=document.createElement(tag);if(text!==undefined)el.textContent=text;parent.append(el);return el;};
async function run() {
  content.replaceChildren();
  if(parameters.has('code')) {
    const code=parameters.get('code'), state=parameters.get('state');
    const expected=sessionStorage.getItem('dashboard-clock-state');
    history.replaceState(null,'',location.pathname);
    if(!expected || state!==expected || !/^[A-Za-z0-9]{16,128}$/.test(code||'')) throw new Error('授权回执不匹配。请使用聊天中的完整授权链接，从同一个手机浏览器重新开始。');
    const der=Uint8Array.from(atob(publicKeyPEM.replace(/-----BEGIN PUBLIC KEY-----|-----END PUBLIC KEY-----|\s/g,'')), c=>c.charCodeAt(0));
    const key=await crypto.subtle.importKey('spki',der,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
    const encrypted=await crypto.subtle.encrypt({name:'RSA-OAEP'},key,new TextEncoder().encode(JSON.stringify({code,state})));
    const receipt='CLOCK1.'+btoa(String.fromCharCode(...new Uint8Array(encrypted)));
    element('p','App 已在 GitHub 创建。请复制下面的加密回执，贴回刚才的 Codex 对话。我会处理密钥，再给你最后的仓库安装链接。');
    const box=element('textarea');box.value=receipt;box.readOnly=true;box.setAttribute('aria-label','加密授权回执');
    const button=element('button','复制加密回执');button.onclick=async()=>{try{await navigator.clipboard.writeText(receipt);button.textContent='已复制，返回对话粘贴即可';}catch{box.focus();box.select();button.textContent='请长按文本复制';}};
    element('small','这段回执已用本次连接专用的公钥加密，不含明文私钥或登录令牌。请在一小时内贴回。此页不向第三方发送数据。');
    return;
  }
  if(parameters.get('stage')==='installed') {
    history.replaceState(null,'',location.pathname);
    element('p','GitHub 安装步骤已完成。请返回 Codex 告诉我，我会核对授权范围并验证自动更新。');return;
  }
  const state=fragment.get('state');
  if(!state || !/^[A-Za-z0-9_-]{40,80}$/.test(state)) throw new Error('请使用 Codex 对话中本次提供的完整授权链接。');
  sessionStorage.setItem('dashboard-clock-state',state);
  history.replaceState(null,'',location.pathname);
  element('p','此步骤为现有看板连接一个只在 GitHub 内运行的计时器。私有源码、数据和发布密钥继续留在私有仓库。');
  element('p','点击下方按钮，在 GitHub 登录 attm-agenticcoding 并确认创建 App。授权只包含 Actions 读写和 GitHub 必需的 Metadata 只读；不包含源码读取或仓库管理权限。之后仅安装到聊天中指定的一个私有仓库。');
  const manifest={name:'attm-dashboard-clock-20261004',url:'https://attm-agenticcoding.github.io/crypto-cycle-dashboard/',description:'Private single-repository dashboard workflow wakeup. Actions permission only.',hook_attributes:{url:pageURL+'?unused-webhook=1',active:false},redirect_url:pageURL,setup_url:pageURL+'?stage=installed',public:false,default_permissions:{actions:'write'},default_events:[]};
  const form=element('form');form.method='post';form.action='https://github.com/settings/apps/new?state='+encodeURIComponent(state);
  const input=element('input',undefined,form);input.type='hidden';input.name='manifest';input.value=JSON.stringify(manifest);
  element('button','前往 GitHub 创建受限 App',form).type='submit';
  element('small','Actions 权限也能访问所选仓库的运行及 artifacts。创建后返回本页，复制加密回执到 Codex；不需要复制或发送私钥。');
}
run().catch(error=>{content.replaceChildren();element('p',error.message).className='error';});
</script></body></html>
